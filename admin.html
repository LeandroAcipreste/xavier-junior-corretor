<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Painel Administrativo | Corretor Xavier Júnior</title>
    <meta name="robots" content="noindex, nofollow" />

    <link rel="icon" type="image/png" sizes="32x32" href="public/img/icone-32.png" />

    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="src/admin/admin.css" />
  </head>

  <body class="admin-page">
    <header class="admin-header">
      <div class="admin-header__brand">
        <img src="public/img/icone-512.png" alt="Xavier Júnior" class="admin-header__logo" />
        <span class="admin-header__title">PAINEL XAVIER JÚNIOR</span>
        <span class="admin-header__badge">Administração Imobiliária</span>
      </div>
      <a href="index.html" class="admin-btn admin-btn--primary admin-header__sair">Ver Vitrine do Site &rarr;</a>
    </header>

    <main class="admin-container">
      <div class="admin-tabs" data-admin="tabs">
        <button type="button" class="admin-tab is-active" data-tab="imoveis">🏡 Imóveis na Vitrine</button>
        <button type="button" class="admin-tab" data-tab="propostas">
          📩 Propostas de Anúncio (<span class="admin-tab__contador" data-admin="count-propostas">0</span>)
        </button>
      </div>

      <!-- ============== SECAO 1: GERENCIAR IMOVEIS ============== -->
      <section id="tab-imoveis" class="admin-panel-section is-active">
        <div class="admin-grid">
          <!-- Formulario de cadastro -->
          <div class="admin-card">
            <h2 class="admin-card__title" data-admin="form-title">Cadastrar Novo Imóvel</h2>

            <form class="admin-form" data-admin="form-imovel">
              <input type="hidden" class="admin-input-hidden" data-campo="id" />

              <div class="admin-form-group">
                <label class="admin-label" for="imovel-titulo">Título do Anúncio *</label>
                <input
                  type="text"
                  id="imovel-titulo"
                  class="admin-input"
                  data-campo="titulo"
                  required
                  placeholder="Ex: Mansão Contemporânea no Alphaville"
                />
              </div>

              <div class="admin-form-row">
                <div class="admin-form-group">
                  <label class="admin-label" for="imovel-preco">Preço (R$) *</label>
                  <input
                    type="text"
                    id="imovel-preco"
                    class="admin-input"
                    data-campo="preco"
                    required
                    placeholder="Ex: R$ 1.850.000,00"
                  />
                </div>
                <div class="admin-form-group">
                  <label class="admin-label" for="imovel-status">Status *</label>
                  <select id="imovel-status" class="admin-select" data-campo="status">
                    <option class="admin-select__opcao" value="Ativo">Ativo na Vitrine</option>
                    <option class="admin-select__opcao" value="Inativo">Inativo / Oculto</option>
                  </select>
                </div>
              </div>

              <div class="admin-form-group">
                <label class="admin-label" for="imovel-bairro">Bairro e Cidade *</label>
                <input
                  type="text"
                  id="imovel-bairro"
                  class="admin-input"
                  data-campo="bairro"
                  required
                  placeholder="Ex: Jardins, Aracaju - SE"
                />
              </div>

              <div class="admin-form-row">
                <div class="admin-form-group">
                  <label class="admin-label" for="imovel-quartos">Quartos</label>
                  <input type="number" id="imovel-quartos" class="admin-input" data-campo="quartos" value="4" min="0" />
                </div>
                <div class="admin-form-group">
                  <label class="admin-label" for="imovel-banheiros">Banheiros</label>
                  <input type="number" id="imovel-banheiros" class="admin-input" data-campo="banheiros" value="4" min="0" />
                </div>
                <div class="admin-form-group">
                  <label class="admin-label" for="imovel-vagas">Vagas</label>
                  <input type="number" id="imovel-vagas" class="admin-input" data-campo="vagas" value="3" min="0" />
                </div>
                <div class="admin-form-group">
                  <label class="admin-label" for="imovel-area">Área (m²)</label>
                  <input type="number" id="imovel-area" class="admin-input" data-campo="area" value="350" min="0" />
                </div>
              </div>

              <div class="admin-form-group">
                <label class="admin-label" for="imovel-descricao">Descrição do Imóvel</label>
                <textarea
                  id="imovel-descricao"
                  class="admin-textarea"
                  data-campo="descricao"
                  rows="3"
                  placeholder="Detalhes de acabamento, localização, área de lazer..."
                ></textarea>
              </div>

              <div class="admin-form-group">
                <label class="admin-label" for="imovel-fotos">Upload de Fotos (clique numa foto para definir a capa)</label>
                <input
                  type="file"
                  id="imovel-fotos"
                  class="admin-input"
                  data-admin="fotos"
                  multiple
                  accept="image/*"
                />
                <div class="admin-photo-grid" data-admin="foto-preview"></div>
              </div>

              <div class="admin-form-actions">
                <button type="submit" class="admin-btn admin-btn--primary admin-btn--expandir">
                  Salvar Imóvel na Vitrine
                </button>
                <button type="button" class="admin-btn admin-btn--neutro" data-admin="cancel-edit" hidden>
                  Cancelar
                </button>
              </div>
            </form>
          </div>

          <!-- Lista de imoveis -->
          <div class="admin-card">
            <h2 class="admin-card__title">Imóveis Cadastrados</h2>
            <div class="admin-table-scroll">
              <table class="admin-table">
                <thead class="admin-table__head">
                  <tr class="admin-table__linha">
                    <th class="admin-table__cabecalho">Capa</th>
                    <th class="admin-table__cabecalho">Imóvel</th>
                    <th class="admin-table__cabecalho">Preço</th>
                    <th class="admin-table__cabecalho">Status</th>
                    <th class="admin-table__cabecalho">Ações</th>
                  </tr>
                </thead>
                <tbody class="admin-table__corpo" data-admin="imoveis-body"></tbody>
              </table>
            </div>
          </div>
        </div>
      </section>

      <!-- ============== SECAO 2: PROPOSTAS RECEBIDAS ============== -->
      <section id="tab-propostas" class="admin-panel-section">
        <div class="admin-card">
          <h2 class="admin-card__title">Propostas de Anúncio Enviadas por Clientes</h2>
          <div class="admin-table-scroll">
            <table class="admin-table">
              <thead class="admin-table__head">
                <tr class="admin-table__linha">
                  <th class="admin-table__cabecalho">Data</th>
                  <th class="admin-table__cabecalho">Cliente</th>
                  <th class="admin-table__cabecalho">Telefone / WhatsApp</th>
                  <th class="admin-table__cabecalho">Endereço do Imóvel</th>
                  <th class="admin-table__cabecalho">Valor Desejado</th>
                  <th class="admin-table__cabecalho">Fotos</th>
                  <th class="admin-table__cabecalho">Ação</th>
                </tr>
              </thead>
              <tbody class="admin-table__corpo" data-admin="propostas-body"></tbody>
            </table>
          </div>
        </div>
      </section>
    </main>

    <script type="module" src="src/admin/admin.js"></script>
  </body>
</html>
